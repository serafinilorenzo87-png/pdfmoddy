<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="armg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF5350"/>
      <stop offset="1" stop-color="#C62828"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#FDECEC"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#D32F2F" stroke-width="12"/>

  <!-- ===== ARMS (behind body), flexing UP ===== -->
  <g stroke="#8E1515" stroke-width="7" stroke-linejoin="round">
    <!-- left arm -->
    <g>
      <rect x="112" y="232" width="78" height="40" rx="20" fill="url(#armg)"/>        <!-- upper arm -->
      <ellipse cx="146" cy="228" rx="38" ry="30" fill="url(#armg)"/>                   <!-- bicep -->
      <rect x="112" y="150" width="40" height="104" rx="20" fill="url(#armg)"/>        <!-- forearm up -->
      <circle cx="132" cy="150" r="30" fill="#ffffff"/>                                 <!-- glove fist -->
      <path d="M118 150 q14 -10 28 0" fill="none" stroke="#C9A3A3" stroke-width="4"/>
    </g>
    <!-- right arm (mirrored) -->
    <g transform="translate(512,0) scale(-1,1)">
      <rect x="112" y="232" width="78" height="40" rx="20" fill="url(#armg)"/>
      <ellipse cx="146" cy="228" rx="38" ry="30" fill="url(#armg)"/>
      <rect x="112" y="150" width="40" height="104" rx="20" fill="url(#armg)"/>
      <circle cx="132" cy="150" r="30" fill="#ffffff"/>
      <path d="M118 150 q14 -10 28 0" fill="none" stroke="#C9A3A3" stroke-width="4"/>
    </g>
  </g>

  <!-- ===== LEGS + SHOES ===== -->
  <g stroke="#8E1515" stroke-width="7" stroke-linejoin="round">
    <rect x="224" y="338" width="20" height="46" rx="10" fill="#B71C1C" stroke="none"/>
    <rect x="268" y="338" width="20" height="46" rx="10" fill="#B71C1C" stroke="none"/>
    <path d="M198 392 q0 -18 22 -18 h20 q16 0 16 16 v2 q0 10 -12 10 h-34 q-12 0 -12 -10 z" fill="#D32F2F"/>
    <path d="M314 392 q0 -18 -22 -18 h-20 q-16 0 -16 16 v2 q0 10 12 10 h34 q12 0 12 -10 z" fill="#D32F2F"/>
  </g>

  <!-- ===== BODY: PDF document ===== -->
  <path d="M176 176 q0 -22 22 -22 l108 0 l34 34 l0 136 q0 22 -22 22 l-120 0 q-22 0 -22 -22 z"
        fill="#ffffff" stroke="#D32F2F" stroke-width="11" stroke-linejoin="round"/>
  <path d="M306 154 l0 34 l34 0 z" fill="#FADBDB" stroke="#D32F2F" stroke-width="7" stroke-linejoin="round"/>

  <!-- eyes -->
  <g>
    <circle cx="226" cy="214" r="26" fill="#ffffff" stroke="#8E1515" stroke-width="4"/>
    <circle cx="288" cy="214" r="26" fill="#ffffff" stroke="#8E1515" stroke-width="4"/>
    <circle cx="230" cy="216" r="13" fill="#1E88E5"/>
    <circle cx="292" cy="216" r="13" fill="#1E88E5"/>
    <circle cx="230" cy="216" r="7" fill="#17202A"/>
    <circle cx="292" cy="216" r="7" fill="#17202A"/>
    <circle cx="226" cy="211" r="4" fill="#ffffff"/>
    <circle cx="288" cy="211" r="4" fill="#ffffff"/>
  </g>

  <!-- big smile -->
  <path d="M220 258 q36 20 72 0 q-6 34 -36 34 q-30 0 -36 -34 z" fill="#7A1620" stroke="#8E1515" stroke-width="4" stroke-linejoin="round"/>
  <path d="M226 260 q30 14 60 0 q-6 10 -30 10 q-24 0 -30 -10 z" fill="#ffffff"/>

  <!-- PDF badge -->
  <rect x="205" y="306" width="102" height="30" rx="9" fill="#D32F2F"/>
  <text x="256" y="328" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800"
        fill="#ffffff" text-anchor="middle" letter-spacing="2">PDF</text>
</svg>
